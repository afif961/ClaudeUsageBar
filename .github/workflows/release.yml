# Push a tag like v1.0 and GitHub builds the Apple Silicon and Intel DMGs and
# attaches them to a release with that name.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]   # Apple Silicon, Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m venv .venv
      - run: ./build_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.runner }}
          path: dist/*.dmg

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dmgs
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dmgs/*.dmg \
            --repo "$GITHUB_REPOSITORY" --title "Claude Usage $GITHUB_REF_NAME" --generate-notes
